[package]
name = "xcpc-server"
description = "The app's local HTTP API (Axum): workspace, publishing, and the problem setter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
xcpc-runtime = { path = "../xcpc-runtime" }
xcpc-setter.workspace = true
xcpc-storage.workspace = true
xcpc-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
notify.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
rust-embed = "8"
mime_guess = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
