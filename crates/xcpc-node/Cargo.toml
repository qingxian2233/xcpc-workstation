[package]
name = "xcpc-node"
description = "Node.js bindings (napi-rs) for the XCPC Workstation core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
bundled-fonts = ["xcpc-engine/bundled-fonts"]

[dependencies]
xcpc-domain.workspace = true
xcpc-storage.workspace = true
xcpc-convert.workspace = true
xcpc-engine.workspace = true
xcpc-lint.workspace = true
serde.workspace = true
serde_json.workspace = true
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
